server:
  port: 8080

spring:
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/FREEPDB1
    username: AGRODB
    password: 1234567
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

  api-docs:
    enabled: true

logging:
  level:
    root: INFO
    pe.edu.upeu.AgroApi_Ticona: DEBUG
    pe.edu.upeu.AgroApi_Ticona.service.impl: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:4200,http://localhost:3000

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000
